  <script type="text/javascript" id="gwd-init-code">
    (function() {
      var gwdAd = document.getElementById('gwd-ad');

      // Visual Elements
      var primaryImage = document.getElementById('VW_1920x1080');
      var fallbackImage = document.getElementById('VW_1920x1080_fallback');

      // State flags
      let calculationsComplete = false;
      let primaryImageLoaded = false;
      let fallbackImageLoaded = false;
      let fontsLoaded = false;
      let vioohReadySent = false;
      let isFallbackMode = false;

      // ========================================================
      // PAINT SYNCHRONIZATION: Double rAF ensures paint before post
      // ========================================================
      function dispatchReadyAfterPaint() {
        if (vioohReadySent) return;
        vioohReadySent = true;

        // Double requestAnimationFrame guarantees DOM style swaps & GPU painting are 100% committed
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            console.log("Visuals painted to glass. Dispatching viooh.ready.");
            window.parent.postMessage({
              event: "viooh.ready"
            }, "*");
          });
        });
      }

      // ========================================================
      // DIRECT FONT CHECK (FSAlbert-Bold & FSAlbert-Regular 58px)
      // ========================================================
      function checkFontsLoaded() {
        const boldFont = '60px "VWHeadBold"';
        const regularFont = '60px "VWHeadRegular"';

        if (!document.fonts) {
          fontsLoaded = true;
          checkVioohReady();
          return;
        }

        if (document.fonts.check(boldFont) && document.fonts.check(regularFont)) {
          console.log("60px VWHead fonts confirmed loaded directly.");
          fontsLoaded = true;
          checkVioohReady();
          return;
        }

        Promise.all([
          document.fonts.load(boldFont),
          document.fonts.load(regularFont),
          document.fonts.ready
        ]).then(function() {
          console.log("60px VWHead fonts loaded and layout ready directly.");
          fontsLoaded = true;
          checkVioohReady();
        }).catch(function(err) {
          console.warn("Font loading error:", err);
          fontsLoaded = true;
          checkVioohReady();
        });
      }

      // ========================================================
      // PRIMARY DYNAMIC IMAGE ON-STAGE CHECK
      // ========================================================
      function checkForPrimaryImageLoaded() {
        if (!primaryImage) {
          primaryImageLoaded = true;
          checkVioohReady();
          return;
        }

        // Supports raw <img>, <gwd-image>, or shadow DOM elements
        const realImg = (primaryImage.shadowRoot && primaryImage.shadowRoot.querySelector('img')) ||
          (primaryImage.tagName === 'IMG' ? primaryImage : primaryImage.querySelector('img')) ||
          primaryImage;

        if (realImg.complete && realImg.naturalWidth > 0) {
          console.log("Primary dynamic image loaded and ready.");
          primaryImageLoaded = true;
          checkVioohReady();
        } else {
          setTimeout(checkForPrimaryImageLoaded, 10);
        }
      }

      // ========================================================
      // FALLBACK IMAGE ON-STAGE CHECK
      // ========================================================
      function checkForFallbackImageLoaded() {
        if (!fallbackImage) {
          fallbackImageLoaded = true;
          checkVioohReady();
          return;
        }

        const realImg = (fallbackImage.shadowRoot && fallbackImage.shadowRoot.querySelector('img')) ||
          (fallbackImage.tagName === 'IMG' ? fallbackImage : fallbackImage.querySelector('img')) ||
          fallbackImage;

        if (realImg.complete && realImg.naturalWidth > 0) {
          console.log("Fallback backup image loaded and ready.");
          fallbackImageLoaded = true;
          checkVioohReady();
        } else {
          setTimeout(checkForFallbackImageLoaded, 10);
        }
      }

      // ========================================================
      // READINESS GATE: Performs DOM Swap first, paints, then posts
      // ========================================================
      function checkVioohReady() {
        if (vioohReadySent) return;

        // SCENARIO A: Fallback image mode
        if (isFallbackMode) {
          if (calculationsComplete && fallbackImageLoaded) {
            if (primaryImage) {
              primaryImage.style.display = "none";
            }
            if (fallbackImage) {
              fallbackImage.style.display = "block";
            }

            dispatchReadyAfterPaint();
          }
        }
        // SCENARIO B: Dynamic Mode (Primary Image + Dynamic Text)
        else {
          if (calculationsComplete && primaryImageLoaded && fontsLoaded) {
            if (primaryImage) {
              primaryImage.style.display = "block";
            }
            if (fallbackImage) {
              fallbackImage.style.display = "none";
            }

            dispatchReadyAfterPaint();
          }
        }
      }

      // ========================================================
      // DOM CONTENT LOADED: Location Calculations
      // ========================================================
      function handleDomContentLoaded(event) {
        var userLatitude;
        var userLongitude;

        var qs = new URLSearchParams(window.location.search);
        var vioohAssetId = qs.get("viooh_asset_id");
      //  vioohAssetId = "9000000018";
        if (typeof frameListData !== 'undefined' && frameListData) {
          var locationData = {};
          for (var i = 0; i < frameListData.length; i++) {
            var row = frameListData[i];
            locationData[row["ASSETUUID"]] = {
              lat: parseFloat(row["LATITUDE"]),
              lon: parseFloat(row["LONGITUDE"])
            };
          }
        }

        if (vioohAssetId && typeof frameListData !== 'undefined' && frameListData) {
          if (locationData && locationData[vioohAssetId]) {
            userLatitude = locationData[vioohAssetId].lat;
            userLongitude = locationData[vioohAssetId].lon;
            console.log(`DOOH Frame Location → Lat: ${userLatitude}, Long: ${userLongitude}`);
          }
        }

        fetchLocation();

        function fetchLocation() {
          if (userLatitude && userLongitude && typeof locationListData !== 'undefined' && locationListData.values) {
            var currentLat = userLatitude;
            var currentLon = userLongitude;
            var nearestStore = null;
            var minDistance = Infinity;

            for (var i = 0; i < locationListData.values.length; i++) {
              var store = locationListData.values[i];
              var storeName = store["RetailerName"];
              var storeLat = parseFloat(store["Latitude"]);
              var storeLon = parseFloat(store["Longitude"]);
              var storeID = store["RetailerID"];
              var distance = getDistanceFromLatLonInKm(currentLat, currentLon, storeLat, storeLon);

              if (distance < minDistance) {
                minDistance = distance;
                nearestStore = {
                  name: storeName,
                  lat: storeLat,
                  lon: storeLon,
                  id: storeID
                };
              }
            }

            if (nearestStore) {
              console.log('Nearest Store:', nearestStore.name);
              console.log('Distance:', minDistance.toFixed(2), 'km');
              var walkingTime = calculateWalkingTime(minDistance, 5);
              console.log('Walking Time: ', walkingTime.toFixed(2), ' minutes');
              const containerStoreName = document.getElementById('nearstoreName');
              //const containerFCA_Copy = document.getElementById('FCA_Copy');

              const storeName = nearestStore.name;
              //const storeCopy = nearestStore.copy;
              //console.log(storeCopy);
              //storeName = 'Lookers Volkswagen Newcastle-upon-Tyne';

              if (containerStoreName) {
                containerStoreName.innerHTML = `<span style="font-family: VWHeadRegular;"> Book your test drive today at </span> <span style="font-family: VWHeadBold;"> ${storeName} </span>`;
                //containerFCA_Copy.innerHTML = ` <span style="font-family: VWHeadRegular;"> ${storeCopy} </span>`;
                //containerFCA_Copy.style.display = "flex";
                //containerFCA_Copy.style.alignItems = "center";
              }
            }
          } else {
            console.log('Activating fallback Image layout. Disabling Primary Dynamic Mode');
            const containerStoreName = document.getElementById('nearstoreName');
            if (containerStoreName) {
              containerStoreName.innerHTML = ` `;
            }

            primaryImageLoaded = false;
            isFallbackMode = true;
          }

          calculationsComplete = true;
          console.log("Dynamic calculations completed.");
          checkVioohReady();
        }

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
          var R = 6371;
          var dLat = deg2rad(lat2 - lat1);
          var dLon = deg2rad(lon2 - lon1);
          var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
          var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
          return R * c;
        }

        function deg2rad(deg) {
          return deg * (Math.PI / 180);
        }

        function calculateWalkingTime(distanceInKm, walkingSpeed = 5) {
          var timeInHours = distanceInKm / walkingSpeed;
          return timeInHours * 60;
        }

        // viooh.play handshake listener (maintained for DOOH player compliance)
        window.addEventListener('message', function(event) {
          if (event.data && event.data.event === 'viooh.play') {
            console.log("viooh.play Event received");
          }
        }, false);
      }

      // ========================================================
      // GWD AD LIFECYCLE
      // ========================================================
      function handleWebComponentsReady(event) {
        requestAnimationFrame(function() {
          setTimeout(function() {
            console.log("Init ad called");
            if (gwdAd && typeof gwdAd.initAd === 'function') {
              gwdAd.initAd();
            }

            if (isFallbackMode) {
              checkForFallbackImageLoaded();
            } else {
              checkFontsLoaded();
              checkForPrimaryImageLoaded();
            }
          }, 1);
        });
      }

      function handleAdInitialized(event) {}

      window.addEventListener('DOMContentLoaded', handleDomContentLoaded, false);
      window.addEventListener('WebComponentsReady', handleWebComponentsReady, false);
      window.addEventListener('adinitialized', handleAdInitialized, false);
    })();
